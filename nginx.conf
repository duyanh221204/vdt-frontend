server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://vdt-backend-svc:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Endpoint nôi bộ để kiểm tra trạng thái của Nginx, chỉ cho phép truy cập từ localhost (container sidecar)
    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1; # Chỉ cho phép truy cập từ localhost (container sidecar)
        deny all;
    }

    location /metrics {
        proxy_pass http://127.0.0.1:9113/metrics;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}